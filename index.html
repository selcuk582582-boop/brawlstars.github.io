<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Stars - Özel Etkinlik</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
    }

    /* Brawl Stars Custom Start Screen Overlay */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0a2a, #4a0e4e, #111);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: pointer;
    }

    .bs-logo {
      font-size: 3rem;
      font-weight: 900;
      color: #ffcc00;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #b30000, 6px 6px 0px #000;
      margin-bottom: 40px;
      letter-spacing: 2px;
      animation: pulse-logo 1.5s infinite alternate;
    }

    @keyframes pulse-logo {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .bs-btn {
      background: linear-gradient(to bottom, #ffcc00, #ff8800);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 15px 50px;
      border: 4px solid #fff;
      border-radius: 15px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #800000;
      box-shadow: 0 8px 0 #b35900, 0 15px 20px rgba(0,0,0,0.5);
      outline: none;
      pointer-events: none; /* Tıklamayı ana kapsayıcıya aktarır */
    }

    /* Stages Container */
    .stage {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 90%;
      max-width: 800px;
      height: 100%;
    }

    .active {
      display: flex !important;
    }

    /* Android Robot */
    .android-robot {
      width: 140px;
      height: 140px;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
    }

    .bouncing {
      animation: bounce 0.6s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-50px); }
    }

    /* Stage 1 Hack Text */
    .hack-title {
      color: #ff0000;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
    }

    /* Green Board Style */
    .green-board {
      border: 4px solid #00ff00;
      background-color: rgba(0, 20, 0, 0.85);
      box-shadow: 0 0 20px #00ff00, inset 0 0 15px #00ff00;
      padding: 40px 30px;
      border-radius: 12px;
      position: relative;
    }

    .green-board-header {
      background-color: #00ff00;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 5px 15px;
      margin-bottom: 25px;
      letter-spacing: 2px;
      display: inline-block;
    }

    .anomaly-text {
      color: #00ff00;
      font-size: 1.8rem;
      line-height: 1.8;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
      white-space: pre-line;
      font-weight: bold;
    }

    /* Glitch Effect */
    .glitching {
      animation: glitch-anim 0.15s infinite;
    }

    @keyframes glitch-anim {
      0% { transform: translate(0); filter: hue-rotate(0deg) contrast(100%); }
      20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg) contrast(200%); }
      40% { transform: translate(-5px, -5px); filter: hue-rotate(180deg) invert(100%); }
      60% { transform: translate(5px, 5px); filter: hue-rotate(270deg) contrast(300%); }
      80% { transform: translate(5px, -5px); filter: hue-rotate(360deg); }
      100% { transform: translate(0); }
    }

    /* Final Stage Text */
    .final-title {
      color: #ff0000;
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 45px #ff0000;
      animation: shake 0.1s infinite;
    }

    @keyframes shake {
      0% { transform: translate(2px, 2px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      40% { transform: translate(1px, -1px) rotate(-1deg); }
      60% { transform: translate(-2px, 1px) rotate(0deg); }
      80% { transform: translate(2px, -2px) rotate(1deg); }
      100% { transform: translate(1px, 2px) rotate(-1deg); }
    }

    /* Red Flashing Overlay */
    #glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      background: rgba(255, 0, 0, 0.2);
    }

    .flash-red {
      animation: flash 0.2s infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- Brawl Stars Custom Start Screen Overlay -->
  <div id="start-overlay">
    <div class="bs-logo">Brawl Stars<br><span style="font-size: 1.5rem; color: #fff;">Özel Etkinlik</span></div>
    <div class="bs-btn">BAŞLA</div>
  </div>

  <div id="glitch-overlay"></div>

  <!-- Stage 1: Initial Hack Message (0 - 5 sec) -->
  <div id="stage1" class="stage">
    <svg class="android-robot bouncing" viewBox="0 0 24 24" fill="#ff0000">
      <path d="M6,18A1,1 0 0,1 5,17V11A1,1 0 0,1 6,10A1,1 0 0,1 7,11V17A1,1 0 0,1 6,18M18,18A1,1 0 0,1 17,17V11A1,1 0 0,1 18,10A1,1 0 0,1 19,11V17A1,1 0 0,1 18,18M15.5,3.58L16.86,2.22A0.5,0.5 0 0,0 16.15,1.5L14.65,3C13.82,2.36 12.8,2 11.7,2C10.6,2 9.58,2.36 8.75,3L7.25,1.5A0.5,0.5 0 0,0 6.54,2.22L7.9,3.58C5.58,5.1 4,7.8 4,11H19.4C19.4,7.8 17.82,5.1 15.5,3.58M8.5,8A0.75,0.75 0 0,1 7.75,7.25A0.75,0.75 0 0,1 8.5,6.5A0.75,0.75 0 0,1 9.25,7.25A0.75,0.75 0 0,1 8.5,8M14.9,8A0.75,0.75 0 0,1 14.15,7.25A0.75,0.75 0 0,1 14.9,6.5A0.75,0.75 0 0,1 15.65,7.25A0.75,0.75 0 0,1 14.9,8M6,12H17.4V17A2.7,2.7 0 0,1 14.7,19.7H8.7A2.7,2.7 0 0,1 6,17V12Z"/>
    </svg>
    <div class="hack-title">bu site asaf tarafından hacklendi : )</div>
  </div>

  <!-- Stage 2 & 3: Green Board Warning (5 - 25 sec) -->
  <div id="stage2" class="stage">
    <div class="green-board">
      <div class="green-board-header">SİSTEM UYARISI</div>
      <div class="anomaly-text">
        acil durum! .<br>
        sitemizde bir anomali .<br>
        tespit ettik programımız .<br>
        birazdan devam edecek
      </div>
    </div>
  </div>

  <!-- Stage 4: Final Hack Explosion (25+ sec) -->
  <div id="stage4" class="stage">
    <svg class="android-robot bouncing" viewBox="0 0 24 24" fill="#ff0000" style="width: 180px; height: 180px;">
      <path d="M6,18A1,1 0 0,1 5,17V11A1,1 0 0,1 6,10A1,1 0 0,1 7,11V17A1,1 0 0,1 18,10A1,1 0 0,1 19,11V17A1,1 0 0,1 18,18M15.5,3.58L16.86,2.22A0.5,0.5 0 0,0 16.15,1.5L14.65,3C13.82,2.36 12.8,2 11.7,2C10.6,2 9.58,2.36 8.75,3L7.25,1.5A0.5,0.5 0 0,0 6.54,2.22L7.9,3.58C5.58,5.1 4,7.8 4,11H19.4C19.4,7.8 17.82,5.1 15.5,3.58M8.5,8A0.75,0.75 0 0,1 7.75,7.25A0.75,0.75 0 0,1 8.5,6.5A0.75,0.75 0 0,1 9.25,7.25A0.75,0.75 0 0,1 8.5,8M14.9,8A0.75,0.75 0 0,1 14.15,7.25A0.75,0.75 0 0,1 14.9,6.5A0.75,0.75 0 0,1 15.65,7.25A0.75,0.75 0 0,1 14.9,8M6,12H17.4V17A2.7,2.7 0 0,1 14.7,19.7H8.7A2.7,2.7 0 0,1 6,17V12Z"/>
    </svg>
    <div class="final-title">bu siteyi ben hackeldim hahahahahahahahaha!</div>
  </div>

  <script>
    let audioCtx = null;
    let masterGain = null;
    let isStarted = false;

    function createSound() {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return;
        audioCtx = new AudioClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);

        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(40, audioCtx.currentTime);

        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

        osc.connect(masterGain);
        noiseNode.connect(filter);
        filter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        osc.start();
        noiseNode.start();
      } catch (e) {
        console.log(e);
      }
    }

    function setVol(val) {
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(val, audioCtx.currentTime);
      }
    }

    function runPrank() {
      if (isStarted) return;
      isStarted = true;

      // Brawl Stars ekranını anında gizle
      document.getElementById('start-overlay').style.display = 'none';

      createSound();

      const stage1 = document.getElementById('stage1');
      const stage2 = document.getElementById('stage2');
      const stage4 = document.getElementById('stage4');
      const glitchOverlay = document.getElementById('glitch-overlay');

      // 0 - 5 SN: İlk Hack Ekranı ve Cızırtı Sesi
      stage1.classList.add('active');
      setVol(0.3);

      // 5 SN: Yeşil Tabela (Sessizlik başlar)
      setTimeout(() => {
        stage1.classList.remove('active');
        stage2.classList.add('active');
        setVol(0);
      }, 5000);

      // 15 SN: Glitch ve Şiddetli Ses Geri Gelir (10 saniye sonra)
      setTimeout(() => {
        stage2.classList.add('glitching');
        glitchOverlay.classList.add('flash-red');
        setVol(0.6);
      }, 15000);

      // 25 SN: Final Hack Ekranı
      setTimeout(() => {
        stage2.classList.remove('active', 'glitching');
        stage4.classList.add('active');
        stage4.classList.add('glitching');
        setVol(1.0);
      }, 25000);
    }

    // Kesin çalışan tıklama dinleyicileri
    const overlay = document.getElementById('start-overlay');
    overlay.onclick = runPrank;
    overlay.ontouchstart = runPrank;
  </script>
</body>
</html>
